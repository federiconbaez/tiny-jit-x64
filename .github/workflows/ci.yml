name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  x86-64:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        sanitize: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: configure
        run: CXX=${{ matrix.cxx }} cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTJIT_SANITIZE=${{ matrix.sanitize }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: cli smoke
        run: |
          test "$(./build/tjit 'x*(y+1) - 3*4' 6 6)" = "30"
          if ./build/tjit 'x +* 2'; then exit 1; fi
      - name: bench
        if: matrix.sanitize == 'OFF'
        run: ./build/bench_tjit

  arm64-emit-only:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTJIT_SANITIZE=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
